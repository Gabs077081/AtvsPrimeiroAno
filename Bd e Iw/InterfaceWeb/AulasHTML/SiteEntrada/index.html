<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Cadastro de Veículo</title>
</head>
<body>

  <h1>Cadastro de Veículo</h1>

  <form action="" method="post">
    <div>
      <label>Nome do Proprietário</label><br>
      <input type="text" placeholder="Digite seu nome completo">
    </div>
    <br>

    <div>
      <label>Email</label><br>
      <input type="email" placeholder="Digite seu email">
    </div>
    <br>

    <div>
      <label>Telefone</label><br>
      <input type="text" placeholder="Digite seu telefone">
    </div>
    <br>

    <div>
      <label>Data de Nascimento</label><br>
      <input type="date">
    </div>
    <br>

    <div>
      <label>Modelo do Veículo</label><br>
      <input type="text" placeholder="Ex: Civic, Corolla, Onix">
    </div>
    <br>

    <div>
      <label>Fabricante</label><br>
      <select>
        <option disabled selected>Selecione o fabricante</option>
        <option>Honda</option>
        <option>Toyota</option>
        <option>Ford</option>
        <option>Chevrolet</option>
      </select>
    </div>
    <br>

    <div>
      <label>Combustível</label><br>
      <input type="radio" name="combustivel"> Gasolina <br>
      <input type="radio" name="combustivel"> Álcool <br>
      <input type="radio" name="combustivel"> Diesel <br>
      <input type="radio" name="combustivel"> Elétrico <br>
      <input type="radio" name="combustivel"> Híbrido/Flex <br>
    </div>
    <br>

    <div>
      <label>Utilidade do Veículo</label><br>
      <input type="checkbox"> Passeio <br>
      <input type="checkbox"> Trabalho <br>
    </div>
    <br>

    <div>
      <input type="submit" value="Enviar">
    </div>
  </form>

</body>
</html>
